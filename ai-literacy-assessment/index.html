<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>AI素养测评 · 发现孩子的另一种可能</title>
<meta name="description" content="首新科技 AI 素养测评。通过生活情境和小挑战，看看孩子如何理解 AI、表达想法、判断信息与解决问题。" />
<meta property="og:type" content="website" />
<meta property="og:title" content="AI素养测评 · 发现孩子的另一种可能" />
<meta property="og:description" content="首新科技｜通过生活情境和小挑战，发现孩子理解 AI、表达想法与解决问题的亮点。" />
<meta property="og:image" content="https://173800607-hash.github.io/campus-talent-assessment/ai-literacy-assessment/assets/shouxin-tech-mark.png" />
<meta property="og:url" content="https://173800607-hash.github.io/campus-talent-assessment/ai-literacy-assessment/" />
<meta name="twitter:card" content="summary" />
<meta name="twitter:title" content="AI素养测评 · 发现孩子的另一种可能" />
<meta name="twitter:description" content="首新科技｜通过生活情境和小挑战，发现孩子理解 AI、表达想法与解决问题的亮点。" />
<meta name="twitter:image" content="https://173800607-hash.github.io/campus-talent-assessment/ai-literacy-assessment/assets/shouxin-tech-mark.png" />
<style>
  :root{
    --blue:#0b3d91; --blue2:#2f7df6; --amber:#ff9f2e; --amber-d:#c96f00;
    --green:#0f8a5f; --violet:#5b4bdc;
    --ink:#0f172a; --sub:#5b6b82; --mute:#8b98ac;
    --line:#e5eaf3; --line2:#eef2f9; --bg:#f4f7fc; --card:#fff;
    --r:18px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:920px; margin:0 auto; padding:0 20px 72px}
  a{color:inherit}

  /* ---------- 顶栏 ---------- */
  .topbar{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:20px 0 10px}
  .brand{display:flex; align-items:center; gap:10px; font-size:14px; letter-spacing:.02em; color:var(--sub)}
  .logo{
    width:30px;height:30px;border-radius:9px;flex:0 0 auto;
    background:linear-gradient(135deg,#0b3d91,#2f7df6);
    display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;letter-spacing:0;
  }
  .brand b{color:var(--ink); font-weight:600}
  .topbar .tag{
    font-size:12px; color:var(--blue); background:#eaf1fe; border:1px solid #d8e5fd;
    padding:4px 10px; border-radius:99px; white-space:nowrap;
  }

  /* ---------- 屏切换 ---------- */
  .screen{display:none}
  .screen.on{display:block; animation:fade .32s ease both}
  @keyframes fade{from{opacity:0; transform:translateY(8px)}to{opacity:1;transform:none}}

  /* ---------- 首页 ---------- */
  .hero{
    background:linear-gradient(135deg,#0b3d91 0%,#1c56b8 55%,#2f7df6 100%);
    border-radius:24px; padding:34px 32px 30px; color:#fff; position:relative; overflow:hidden;
  }
  .hero::after{
    content:""; position:absolute; right:-70px; top:-90px; width:280px; height:280px; border-radius:50%;
    background:radial-gradient(circle,rgba(150,196,255,.38),rgba(150,196,255,0) 68%);
  }
  .hero .eyebrow{font-size:12.5px; letter-spacing:.16em; color:#bcd4ff; margin:0 0 12px}
  .hero h1{margin:0; font-size:30px; line-height:1.35; font-weight:700; letter-spacing:.01em}
  .hero h1 em{font-style:normal; color:var(--amber)}
  .hero p{margin:14px 0 0; color:#d6e3ff; font-size:14.5px; max-width:52ch}
  .hero .facts{display:flex; flex-wrap:wrap; gap:22px; margin-top:22px; padding-top:20px; border-top:1px solid rgba(255,255,255,.18)}
  .hero .facts div{font-size:12.5px; color:#b9cdf5}
  .hero .facts b{display:block; color:#fff; font-size:19px; font-weight:700; letter-spacing:.02em; margin-bottom:2px}

  .picks{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:20px}
  .pick{
    background:var(--card); border:1px solid var(--line); border-radius:var(--r);
    padding:24px 22px; display:flex; flex-direction:column; cursor:pointer;
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    text-align:left; font:inherit; color:inherit;
  }
  .pick:hover{transform:translateY(-2px); box-shadow:0 14px 32px rgba(15,40,90,.10); border-color:#cfdcf3}
  .pick .kicker{display:flex; align-items:center; gap:8px; font-size:12px; letter-spacing:.04em; color:var(--mute)}
  .pick .dot{width:7px;height:7px;border-radius:50%;background:var(--blue2)}
  .pick.b .dot{background:var(--amber)}
  .pick h3{margin:10px 0 6px; font-size:21px; font-weight:700; letter-spacing:.01em}
  .pick .use{font-size:13.5px; color:var(--sub); margin:0}
  .pick .use b{color:var(--blue); font-weight:600}
  .pick.b .use b{color:var(--amber-d)}
  .pick ul{margin:14px 0 18px; padding:0; list-style:none; font-size:13px; color:var(--sub)}
  .pick ul li{position:relative; padding-left:15px; margin:6px 0}
  .pick ul li::before{content:""; position:absolute; left:0; top:9px; width:4px; height:4px; border-radius:50%; background:#c3cfe3}
  .pick .go{margin-top:auto; font-size:14px; font-weight:600; color:var(--blue); display:flex; align-items:center; gap:6px}
  .pick.b .go{color:var(--amber-d)}

  /* ---------- 设置页 ---------- */
  .setup{background:var(--card); border:1px solid var(--line); border-radius:22px; padding:30px 28px; margin-top:8px}
  .setup h2{margin:0 0 6px; font-size:21px}
  .setup .lead{margin:0 0 24px; color:var(--sub); font-size:14px}
  .field{margin-bottom:22px}
  .field > label{display:block; font-size:12.5px; letter-spacing:.08em; color:var(--mute); margin-bottom:10px}
  .chips{display:flex; gap:9px; flex-wrap:wrap}
  .chip{
    border:1.5px solid var(--line); background:#fff; border-radius:12px; padding:11px 20px;
    font:inherit; font-size:15px; color:var(--ink); cursor:pointer; transition:.15s; min-height:46px;
  }
  .chip:hover{border-color:#bfd2f1}
  .chip.on{border-color:var(--blue2); background:#eff5ff; color:var(--blue); font-weight:600}
  .inp{
    width:100%; border:1.5px solid var(--line); border-radius:12px; padding:12px 14px;
    font:inherit; font-size:15px; color:var(--ink); background:#fff; outline:none;
  }
  .inp:focus{border-color:var(--blue2); box-shadow:0 0 0 3px rgba(47,125,246,.12)}
  .hint{font-size:12.5px; color:var(--mute); margin-top:8px}
  .notice{
    background:#f7f9fe; border:1px solid #e3ebf9; border-radius:14px; padding:14px 16px;
    font-size:13px; color:var(--sub); margin-bottom:22px;
  }
  .notice b{color:var(--ink)}
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    border:none; border-radius:13px; padding:14px 26px; font:inherit; font-size:15.5px; font-weight:600;
    cursor:pointer; transition:.16s; min-height:50px;
  }
  .btn-main{background:var(--blue); color:#fff; box-shadow:0 8px 20px rgba(11,61,145,.20)}
  .btn-main:hover{background:#093275; transform:translateY(-1px)}
  .btn-main[disabled]{background:#c9d4e6; box-shadow:none; cursor:not-allowed; transform:none}
  .btn-amber{background:var(--amber); color:#2a1a03; box-shadow:0 8px 20px rgba(255,159,46,.28)}
  .btn-amber:hover{background:#ffab45; transform:translateY(-1px)}
  .btn-ghost{background:#fff; border:1.5px solid var(--line); color:var(--sub)}
  .btn-ghost:hover{border-color:#c8d6ec; color:var(--ink)}
  .btn-block{width:100%}

  /* ---------- 答题页 ---------- */
  .qhead{position:sticky; top:0; z-index:20; padding:12px 0 10px; background:linear-gradient(180deg,var(--bg) 72%,rgba(244,247,252,0))}
  .qmeta{display:flex; align-items:center; justify-content:space-between; font-size:12.5px; color:var(--mute); margin-bottom:8px}
  .qmeta .dim{color:var(--blue); background:#eaf1fe; border-radius:99px; padding:3px 10px; font-size:12px}
  .qmeta .dim.pot{color:var(--amber-d); background:#fff3e0}
  .bar{height:6px; background:#e3eaf6; border-radius:99px; overflow:hidden}
  .bar i{display:block; height:100%; width:0; border-radius:99px; background:linear-gradient(90deg,#2f7df6,#0b3d91); transition:width .32s ease}
  .bar i.pot{background:linear-gradient(90deg,#ffb85c,#ee8b12)}

  .qcard{background:var(--card); border:1px solid var(--line); border-radius:22px; padding:30px 28px; margin-top:10px}
  .qcard .no{font-size:12.5px; letter-spacing:.1em; color:var(--mute); margin-bottom:12px}
  .qcard .stem{font-size:21px; line-height:1.6; font-weight:600; margin:0 0 6px; letter-spacing:.01em}
  .legend{font-size:14px; color:var(--sub); background:#f6f9ff; border:1px dashed #dbe6f9; border-radius:12px; padding:12px 14px; margin:14px 0 4px; line-height:1.9}
  .opts{margin-top:20px; display:flex; flex-direction:column; gap:10px}
  .opt{
    display:flex; gap:14px; align-items:flex-start; width:100%; text-align:left;
    background:#fff; border:1.5px solid var(--line); border-radius:14px; padding:15px 17px;
    font:inherit; font-size:16.5px; line-height:1.55; color:var(--ink); cursor:pointer;
    transition:border-color .14s, background .14s, box-shadow .14s;
  }
  .opt:hover{border-color:#b9cdf0; box-shadow:0 4px 14px rgba(11,61,145,.07)}
  .opt .k{
    flex:0 0 28px; height:28px; border-radius:9px; background:#eef3fd; color:var(--blue);
    font-weight:700; font-size:14px; display:grid; place-items:center; margin-top:1px;
  }
  .opt.sel{border-color:var(--blue2); background:#f4f9ff}
  .opt.sel .k{background:var(--blue2); color:#fff}
  .qfoot{display:flex; justify-content:space-between; align-items:center; margin-top:18px; gap:10px}
  .linkbtn{background:none; border:none; font:inherit; font-size:13.5px; color:var(--mute); cursor:pointer; padding:8px 4px}
  .linkbtn:hover{color:var(--blue)}
  .linkbtn[disabled]{opacity:.35; cursor:default}
  .divider-note{
    display:flex; align-items:center; gap:12px; margin:16px 0 2px; color:var(--amber-d);
    font-size:12.5px; letter-spacing:.06em;
  }
  .divider-note::before,.divider-note::after{content:""; height:1px; background:#f3dcc0; flex:1}

  /* ---------- 结果页 ---------- */
  .rhero{
    background:linear-gradient(135deg,#0b3d91 0%,#1c56b8 60%,#2f7df6 100%);
    color:#fff; border-radius:22px; padding:28px 30px; position:relative; overflow:hidden;
  }
  .rhero.amber{background:linear-gradient(135deg,#8a5100 0%,#c47708 55%,#ff9f2e 100%)}
  .rhero .row{display:flex; align-items:flex-end; gap:20px; flex-wrap:wrap}
  .rhero .big{font-size:56px; font-weight:800; line-height:1; letter-spacing:-.02em}
  .rhero .big small{font-size:20px; font-weight:600; opacity:.7; margin-left:2px}
  .rhero .lv{font-size:26px; font-weight:700; letter-spacing:.02em}
  .rhero .lv span{font-size:13px; font-weight:500; opacity:.72; margin-left:8px; letter-spacing:.06em}
  .rhero .line{margin:16px 0 0; font-size:15.5px; color:#e2ecff; max-width:56ch}
  .rhero .who{font-size:12.5px; opacity:.72; letter-spacing:.04em; margin:0 0 14px}
  .rhero .hstars{font-size:24px; letter-spacing:5px; color:#ffc46b; line-height:1; padding-bottom:3px}
  .rhero .hstars i{color:rgba(255,255,255,.3); font-style:normal}
  .pill{display:inline-block; font-size:12px; padding:4px 11px; border-radius:99px; background:rgba(255,255,255,.16); color:#fff; letter-spacing:.04em}
  .rchips{display:flex; flex-wrap:wrap; gap:8px; margin-top:18px; padding-top:16px; border-top:1px solid rgba(255,255,255,.18)}
  .rchips div{font-size:12px; color:#c2d6f6; background:rgba(255,255,255,.10); border-radius:10px; padding:7px 11px; line-height:1.4}
  .rchips div b{display:block; color:#fff; font-size:15px; font-weight:700; letter-spacing:.01em; margin-top:1px}
  .rchips div.amber{background:rgba(255,196,107,.18)}
  .rchips div.amber b{color:#ffd08a}

  .sec{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:22px 24px; margin-top:14px}
  .sec > h3{margin:0 0 4px; font-size:12px; letter-spacing:.14em; color:var(--mute); font-weight:600}
  .sec > h3 .em{color:var(--blue); letter-spacing:0; font-size:13px}
  .sec > .body{margin-top:10px; font-size:15px; color:#243449}
  .sec > .body p{margin:0 0 10px}
  .sec > .body p:last-child{margin-bottom:0}
  .sub{font-size:12px; color:var(--mute); margin-top:10px; line-height:1.7}

  /* 双栏：雷达 + 阶梯 */
  .duo{display:grid; grid-template-columns:1fr 1fr; gap:22px; align-items:start; margin-top:6px}
  .duo .pane{min-width:0}
  .pane .cap{font-size:11.5px; letter-spacing:.08em; color:var(--mute); margin:0 0 6px}
  svg.radar{width:100%; height:auto; display:block; overflow:visible}

  .drow{display:grid; grid-template-columns:104px 1fr 56px; gap:10px; align-items:center; padding:8px 0; border-bottom:1px dashed var(--line2)}
  .drow:last-child{border-bottom:none}
  .drow .dn{font-size:13.5px; font-weight:600; display:flex; align-items:center; gap:5px; white-space:nowrap}
  .drow .stars{letter-spacing:1.5px; font-size:13.5px; color:var(--amber); line-height:1}
  .drow .stars i{color:#dfe6f1; font-style:normal}
  .drow .sc{font-size:12px; color:var(--sub); text-align:right; font-variant-numeric:tabular-nums}
  .dtag{display:inline-block; font-size:10px; padding:1px 5px; border-radius:6px; background:#eef3fd; color:var(--blue); vertical-align:1px; flex:0 0 auto; white-space:nowrap}
  .dtag.w{background:#fff1e0; color:var(--amber-d)}

  /* 认知阶梯 */
  .ladder{display:flex; flex-direction:column-reverse; gap:5px}
  .lstep{
    display:grid; grid-template-columns:34px 1fr; gap:9px; align-items:center;
    padding:7px 10px; border-radius:10px; border:1px solid transparent; font-size:12.5px; color:var(--mute);
    transition:.2s;
  }
  .lstep .cc{font-size:11px; font-weight:700; letter-spacing:.03em; color:#b6c2d4}
  .lstep .nn{font-weight:500}
  .lstep.past{color:#9aa8bd}
  .lstep.on{background:linear-gradient(90deg,#eff5ff,#f8fbff); border-color:#cfe0fb; color:var(--ink)}
  .lstep.on .cc{color:var(--blue2)}
  .lstep.on .nn{font-weight:700}
  .lstep.on .cc{display:inline-flex; align-items:center; gap:5px}

  /* 潜力仪表 */
  .gwrap{margin-top:4px}
  .gnum{display:flex; align-items:baseline; gap:8px}
  .gnum b{font-size:34px; font-weight:800; letter-spacing:-.02em; color:var(--blue); line-height:1.1}
  .gnum .band{font-size:12.5px; color:var(--sub)}
  .gtrack{position:relative; height:12px; border-radius:99px; background:linear-gradient(90deg,#eef2f8 0%,#e6ecf6 100%); margin:14px 0 6px}
  .gtrack .rng{position:absolute; top:0; height:100%; border-radius:99px; background:linear-gradient(90deg,#bfd6fb,#7fb0f7)}
  .gtrack .mk{position:absolute; top:-4px; width:3px; height:20px; border-radius:2px; background:var(--blue); box-shadow:0 0 0 3px rgba(47,125,246,.16)}
  .gscale{display:flex; justify-content:space-between; font-size:11px; color:#a8b4c7; font-variant-numeric:tabular-nums}

  .bars{margin-top:14px}
  .brow{display:grid; grid-template-columns:64px 1fr 42px; gap:10px; align-items:center; padding:6px 0; font-size:12.5px}
  .brow .bl{color:var(--sub); white-space:nowrap}
  .brow .bt{height:7px; border-radius:99px; background:#eef2f8; overflow:hidden}
  .brow .bt i{display:block; height:100%; border-radius:99px; background:linear-gradient(90deg,#9ec2f9,#2f7df6)}
  .brow .bt i.low{background:linear-gradient(90deg,#ffd8a8,#ff9f2e)}
  .brow .bv{text-align:right; color:var(--sub); font-variant-numeric:tabular-nums}

  details.rules{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:16px 22px; margin-top:14px}
  details.rules > summary{
    cursor:pointer; list-style:none; display:flex; align-items:center; justify-content:space-between;
    font-size:12.5px; letter-spacing:.1em; color:var(--sub); min-height:24px;
  }
  details.rules > summary::-webkit-details-marker{display:none}
  details.rules > summary::after{content:"＋"; color:var(--mute); font-size:14px; letter-spacing:0}
  details.rules[open] > summary::after{content:"－"}
  details.rules .body{margin-top:14px; font-size:13.4px; color:var(--sub); line-height:1.85}
  details.rules .body p{margin:0 0 9px}
  details.rules .body p:last-child{margin-bottom:0}
  details.rules .body b{color:var(--ink); font-weight:600}

  .hl{border-left:3px solid var(--blue2); background:#f6faff; border-radius:0 14px 14px 0; padding:15px 18px; font-size:14.8px}
  .warn{border-left:3px solid var(--amber); background:#fffaf2; border-radius:0 14px 14px 0; padding:15px 18px; font-size:14.8px}
  .warn .h{font-size:13px; color:var(--amber-d); font-weight:600; letter-spacing:.02em; margin-bottom:6px}
  .warn .act{margin-top:10px; padding-top:10px; border-top:1px dashed #f0dcbe; font-size:14px; color:#5d4520}
  .warn .act b{color:var(--amber-d)}

  .path{display:grid; gap:10px}
  .pstep{display:grid; grid-template-columns:26px 1fr; gap:12px; align-items:start; font-size:14.5px}
  .pstep .idx{width:24px;height:24px;border-radius:8px;background:#eaf1fe;color:var(--blue);font-size:12.5px;font-weight:700;display:grid;place-items:center;margin-top:2px}
  .pstep b{font-weight:600}

  .cta{background:linear-gradient(135deg,#101d33,#0b3d91 70%); color:#fff; border-radius:20px; padding:26px 26px 24px; margin-top:16px; position:relative; overflow:hidden}
  .cta::after{content:"";position:absolute;right:-60px;bottom:-90px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,159,46,.30),transparent 70%)}
  .cta h3{margin:0 0 8px; font-size:20px; letter-spacing:.01em}
  .cta p{margin:0 0 18px; font-size:14px; color:#c6d6f2; max-width:56ch}
  .cta .btn{position:relative; z-index:1}

  .acct{display:flex; gap:10px; flex-wrap:wrap; margin-top:16px}

  .foot{margin-top:26px; font-size:12px; color:var(--mute); line-height:1.9}
  .foot b{color:var(--sub); font-weight:600}

  /* 学校版双视图 */
  .tabs{display:inline-flex; gap:4px; background:#e9eef8; padding:4px; border-radius:13px; margin-top:16px; margin-bottom:14px}
  .tabs button{border:none; background:none; font:inherit; font-size:13.5px; color:var(--sub); padding:9px 18px; border-radius:10px; cursor:pointer}
  .tabs button.on{background:#fff; color:var(--blue); font-weight:600; box-shadow:0 2px 6px rgba(15,40,90,.08)}

  table.tbl{width:100%; border-collapse:collapse; font-size:13.5px; margin-top:6px}
  table.tbl th{text-align:left; font-weight:600; font-size:11.5px; letter-spacing:.06em; color:var(--mute); padding:8px 9px; border-bottom:1px solid var(--line); background:#fafcff}
  table.tbl td{padding:8px 9px; border-bottom:1px solid var(--line2); vertical-align:top}
  table.tbl tr:last-child td{border-bottom:none}
  .mono{font-variant-numeric:tabular-nums}

  .kv{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:6px}
  .kv div{background:#f7faff; border:1px solid #e6eefa; border-radius:12px; padding:12px}
  .kv span{display:block; font-size:11px; color:var(--mute); letter-spacing:.04em; white-space:nowrap}
  .kv b{display:block; font-size:19px; font-weight:700; margin-top:2px; font-variant-numeric:tabular-nums; line-height:1.3}
  .kv b small{font-size:11.5px; font-weight:500; color:var(--mute); margin-left:1px}

  .modal{position:fixed; inset:0; background:rgba(9,18,38,.48); display:none; place-items:center; z-index:60; padding:20px}
  .modal.on{display:grid}
  .modal .box{background:#fff; border-radius:20px; padding:26px; max-width:420px; width:100%; box-shadow:0 24px 60px rgba(9,18,38,.28)}
  .modal h3{margin:0 0 6px; font-size:19px}
  .modal p{margin:0 0 18px; font-size:13.5px; color:var(--sub)}

  @media (max-width:760px){
    .app{padding:0 15px 60px}
    .picks{grid-template-columns:1fr}
    .hero{padding:26px 22px 24px; border-radius:20px}
    .hero h1{font-size:24px}
    .hero .facts{display:grid; grid-template-columns:1fr 1fr; gap:14px 18px}
    .acct{flex-direction:column}
    .acct .btn{width:100%}
    .qcard{padding:22px 18px; border-radius:18px}
    .qcard .stem{font-size:18.5px}
    .opt{font-size:15.5px; padding:14px 14px}
    .rhero{padding:22px 20px}
    .rhero .big{font-size:46px}
    .rhero .lv{font-size:22px}
    .sec{padding:18px 17px}
    .duo{grid-template-columns:1fr; gap:18px}
    .kv{grid-template-columns:repeat(2,1fr)}
    .drow{grid-template-columns:96px 1fr 50px; gap:8px}
    .drow .dn{font-size:12.8px; gap:4px}
    .dtag{font-size:9.5px; padding:1px 4px}
    .drow .sc{font-size:11.5px}
    .setup{padding:22px 18px}
    .rchips div{font-size:11.5px; padding:6px 10px}
    .rchips div b{font-size:14px}
  }

  /* Home introduction follows the light, four-step reference layout. */
  #s-home .hero{background:transparent;color:#20314c;border-radius:0;padding:28px 28px 12px;overflow:visible}
  #s-home .hero::after{display:none}
  #s-home .hero .eyebrow{display:inline-block;margin:0 0 20px;padding:9px 16px;border-radius:999px;background:#eaf1ff;color:#4775ee;font-size:13px;font-weight:700;letter-spacing:0}
  #s-home .hero h1{font-size:38px;line-height:1.28;letter-spacing:-.03em}
  #s-home .hero h1 em{color:#4a75fa}
  #s-home .hero p:not(.eyebrow){font-size:17px;line-height:1.75;color:#637590;max-width:65ch;margin-top:14px}
  .journey{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:26px}
  .journey div{min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid #dce6f8;border-radius:16px;background:#fff;text-align:center}
  .journey b{font-size:13px;color:#4a75fa}.journey span{font-size:11px;color:#7d8da8;margin-top:3px}
  @media(max-width:760px){#s-home .hero{padding:22px 5px 7px}#s-home .hero h1{font-size:29px}#s-home .hero p:not(.eyebrow){font-size:14px}.journey{gap:5px;margin-top:22px}.journey div{min-height:52px;border-radius:12px}.journey span{font-size:10px}}
  .pdf-download{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
  .pick .quick-meta{margin:18px 0 22px;color:var(--sub);font-size:13.5px;line-height:1.9}
  @media print{
    body{background:#fff}
    .noprint{display:none !important}
    .app{max-width:none; padding:0}
    .sec,.rhero,.cta{break-inside:avoid-box; box-shadow:none}
    .rhero{color:#fff !important; -webkit-print-color-adjust:exact; print-color-adjust:exact}
    .sec{border-color:#d8dfec}
    @page{margin:14mm}
  }
.brand-mark{display:inline-flex;width:32px;height:32px;border-radius:50%;overflow:hidden;align-items:flex-start;justify-content:center;background:#fff;vertical-align:middle;flex:none}.brand-mark img{width:44px;height:44px;max-width:none;object-fit:cover;object-position:center top;transform:translateY(-2px)}
  /* 手机窄屏：入口、选择题和报告保持一列，表格只在自身区域横向滚动。 */
  @media(max-width:480px){
    html,body{width:100%;max-width:100%;overflow-x:hidden}
    .app{width:100%;max-width:100%;padding:0 14px calc(44px + env(safe-area-inset-bottom))}
    .topbar{padding:12px 0 9px;gap:8px}
    .brand{min-width:0;gap:7px;font-size:12px;white-space:nowrap}
    .brand b{white-space:nowrap}
    .topbar .tag{font-size:10px;padding:4px 7px;flex:none}
    #s-home .hero{padding:16px 2px 4px}
    #s-home .hero .eyebrow{font-size:11px;padding:7px 10px;margin-bottom:16px}
    #s-home .hero h1{font-size:clamp(25px,7.3vw,31px);line-height:1.35}
    #s-home .hero p:not(.eyebrow){font-size:13.5px;line-height:1.7}
    .journey{grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
    .journey div{min-width:0;min-height:52px;padding:4px 2px}
    .journey b{font-size:12px}.journey span{font-size:10px;white-space:nowrap}
    .picks{gap:12px;margin-top:17px}
    .pick{padding:19px 18px;border-radius:16px}
    .pick h3{font-size:20px;margin:0 0 5px}
    .pick .quick-meta{margin:13px 0 14px;font-size:13px}
    .setup{padding:20px 16px;margin-top:6px}
    .chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
    .chip{width:100%;padding:10px 5px}
    .qcard{padding:19px 16px}.qcard .stem{font-size:18px;line-height:1.55}
    .opt{gap:10px;padding:12px;font-size:15px;overflow-wrap:anywhere}
    .opt .k{flex-basis:27px;height:27px}
    .rhero{padding:20px 16px}.rhero .big{font-size:40px}.rhero .lv{font-size:20px}
    .sec{padding:17px 15px}.sec,.rhero,.qcard,.setup{min-width:0;overflow-wrap:anywhere}
    .duo{grid-template-columns:minmax(0,1fr)}
    .drow{grid-template-columns:minmax(78px,92px) minmax(0,1fr) 44px;gap:5px}
    .drow .dn{white-space:normal;font-size:12px}
    .drow .stars{font-size:12px;letter-spacing:0}
    .kv{grid-template-columns:repeat(2,minmax(0,1fr))}.kv div{min-width:0;padding:9px}
    .kv span{white-space:normal}.kv b{font-size:17px}
    table.tbl{display:block;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
    table.tbl th,table.tbl td{min-width:74px}
    .tabs{display:flex;width:100%}.tabs button{flex:1;padding:10px 6px}
    .hl,.warn{padding:13px 12px}
    .acct{gap:8px}.acct .btn{width:100%}
  }
  .report-image-view{position:fixed;inset:0;z-index:100;background:#f4f7fc;overflow:auto;padding:12px 12px calc(24px + env(safe-area-inset-bottom))}
  .report-image-view .image-toolbar{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border-radius:12px;padding:9px 12px;margin-bottom:10px;box-shadow:0 3px 16px #15335a1a;font-size:13px;color:#425678}
  .report-image-view .image-toolbar button{border:0;background:#eaf1ff;color:#0b3d91;border-radius:9px;padding:8px 12px;font:inherit;white-space:nowrap}
  .report-image-view img{display:block;width:min(100%,780px);height:auto;margin:0 auto;background:#fff;box-shadow:0 3px 20px #15335a18;-webkit-touch-callout:default}
</style>

<script>
"use strict";

/* =========================================================
   一、数据层
   ========================================================= */
const DIMS = [
  { n:"认知理解", s:"认", desc:"AI 是什么、怎么学、会错在哪、边界在哪" },
  { n:"指令表达", s:"说", desc:"把需求说清楚，一次没说对会换说法" },
  { n:"判断核实", s:"判", desc:"会核对、会溯源，不轻信“看起来真”" },
  { n:"创意建构", s:"做", desc:"会拆任务、会迭代，能真的做出东西" },
  { n:"伦理安全", s:"守", desc:"隐私、署名、依赖、偏见上的边界感" },
  { n:"自主学习", s:"自", desc:"遇错怎么办，是拿答案还是学过程" }
];
const LET = ["A","B","C","D"];

/* 误区标签体系（W1—W9） */
const TRAPS = {
  W1:{ short:"把 AI 当人",
       diag:"他还在用“人”的方式理解 AI——以为它听得懂、会故意骗人、有脾气、有立场。",
       expl:"这个阶段很正常，但如果一直这样理解，他会高估 AI 的判断力，也更容易被“它最懂你”这类说法带走。",
       act:"下次他用 AI 时问一句“它为什么这么说”，让他试着说出“这是它从哪儿学来的”。" },
  W2:{ short:"以为它不会错",
       diag:"他默认 AI 说的基本是对的，很少想到它也会错、也会编、也会过时。",
       expl:"这不是知识缺口，是习惯缺口——他还没有“再看一眼”的动作。低年级孩子几乎都这样，越早建立这个动作越省事。",
       act:"每周让他抓一次 AI 的错：问一件本地的小事，然后一起去查证。" },
  W3:{ short:"只看像不像真的",
       diag:"他判断真假时更看“像不像真的”——点赞多、说得长、语气肯定、画面清楚，这些都在影响他。",
       expl:"AI 生成的内容恰恰最擅长“看起来真”。靠表面线索判断，在他这一代身上会比在您身上更容易失效。",
       act:"看到一条可疑内容时，和他一起找“谁能证明这件事”——气象、学校、官方账号。" },
  W4:{ short:"要求说得笼统",
       diag:"他让 AI 做事时说得比较笼统，比如“帮我写个东西”，所以常常拿不到想要的结果。",
       expl:"这不是表达能力问题，是没有人教过他“提要求要说清哪几件事”。这类孩子一教就会，因为他不缺想法。",
       act:"每次让 AI 做事前，让他先说清三件事：做什么、给谁看、要多长。" },
  W5:{ short:"分不清边界",
       diag:"他还不太清楚 AI 能做什么、不能做什么，容易把“需要人判断的事”交给它。",
       expl:"边界感是从“它做不到什么”开始建立的，而不是从“它能做什么”开始。这一点很多课都讲反了。",
       act:"和他玩一个游戏：轮流说一件 AI 做不到的事，说不出就输。" },

/* =========================================================
   五、通用：标签解析、认知阶梯、成长潜力
   ========================================================= */
function tagsOf(it){
  if(it.t) return it.t.split(",").map(s => s.trim() === "-" ? null : s.trim());
  return it.o.map(function(o, i){ return i === it.a ? null : (Array.isArray(o) ? o[1] : null); });
}
function rightOf(it){
  if(typeof it.a === "number") return it.a;
  return it.o.findIndex(x => Array.isArray(x) && x[1] === null);
}

/* 维度定级：并列时按“哪一项最卡住其他项”优先 */
const PRIO = [2, 0, 1, 5, 3, 4];
function pickWorst(rates){
  let k = PRIO[0];
  for(let j = 0; j < PRIO.length; j++){
    const i = PRIO[j];
    if(rates[i] < rates[k] - 1e-9) k = i;
  }
  return k;
}

/* 认知阶梯：认知维达成率 85% ＋ 原理型误区密度 15%（误区越密，越往下压） */
function cogIndex(rateD0, conceptWrong, conceptMax){
  const r1 = clamp(rateD0, 0, 1);
  const r2 = 1 - clamp(conceptWrong / Math.max(1, conceptMax), 0, 1);
  return Math.round(100 * (0.85 * r1 + 0.15 * r2));
}
function cogLevel(idx){
  if(idx >= 88) return 5;
  if(idx >= 74) return 4;
  if(idx >= 58) return 3;
  if(idx >= 40) return 2;
  if(idx >= 22) return 1;
  return 0;
}

/* 成长潜力：四因子 */
function gpiCalc(sig){
  /* sig: {T,D,R,S} 各 0—1，以及 potRate 可选 */
  const raw = sig.potRate != null
    ? 100 * (0.40 * sig.potRate + 0.25 * sig.D + 0.20 * sig.T + 0.15 * sig.R)
    : 100 * (0.30 * sig.T + 0.30 * sig.D + 0.25 * sig.R + 0.15 * sig.S);
  const gpi = Math.round(clamp(raw, 0, 100));
  const band = sig.potRate != null ? 7 : 8;
  return { gpi, lo: clamp(gpi - band, 0, 100), hi: clamp(gpi + band, 0, 100), band };
}

/* 迁移力：同技能两题都对 → 该组算迁移成功 */
function transferScore(items, ans, offset){
  const groups = {};
  items.forEach(function(it, i){
    if(!it.sk) return;
    groups[it.sk] = groups[it.sk] || { all:true, n:0 };
    groups[it.sk].n++;
    if(ans[offset + i] !== rightOf(it)) groups[it.sk].all = false;
  });
  const keys = Object.keys(groups);
  if(!keys.length) return { v:0.5, ok:0, total:0 };
  const ok = keys.filter(k => groups[k].all).length;
  return { v: ok / keys.length, ok: ok, total: keys.length };
}

/* 稳定性：六维达成率的离散度 */
function stabilityOf(rates){
  const m = mean(rates);
  const sd = Math.sqrt(mean(rates.map(x => (x - m) * (x - m))));
  return clamp(1 - sd / 0.32, 0, 1);
}

/* =========================================================
   六、雷达图 / 阶梯 / 仪表
   ========================================================= */
function radarSVG(vals, opts){
  opts = opts || {};
  const n = 6, cx = 170, cy = 156, R = 100;
  const ang = i => (-90 + i * 60) * Math.PI / 180;
  const pt = (i, r) => [cx + Math.cos(ang(i)) * r, cy + Math.sin(ang(i)) * r];
  let g = "";
  [0.25, 0.5, 0.75, 1].forEach(function(k){
    const p = Array.from({length:n}, (_, i) => pt(i, R*k).map(v => v.toFixed(1)).join(",")).join(" ");
    g += '<polygon points="' + p + '" fill="none" stroke="#e6ebf4" stroke-width="1"/>';
  });
  for(let i = 0; i < n; i++){
    const q = pt(i, R);
    g += '<line x1="' + cx + '" y1="' + cy + '" x2="' + q[0].toFixed(1) + '" y2="' + q[1].toFixed(1) + '" stroke="#eaeff7" stroke-width="1"/>';
  }
  const shape = vals.map(function(v, i){
    return pt(i, R * clamp(v / 100, 0.10, 1)).map(x => x.toFixed(1)).join(",");
  }).join(" ");
  g += '<polygon points="' + shape + '" fill="rgba(47,125,246,.17)" stroke="#2f7df6" stroke-width="2" stroke-linejoin="round"/>';
  vals.forEach(function(v, i){
    const q = pt(i, R * clamp(v / 100, 0.10, 1));
    g += '<circle cx="' + q[0].toFixed(1) + '" cy="' + q[1].toFixed(1) + '" r="3.4" fill="#fff" stroke="#2f7df6" stroke-width="2"/>';
  });
  DIMS.forEach(function(dm, i){
    const q = pt(i, R + 26);
    const cosv = Math.cos(ang(i)), sinv = Math.sin(ang(i));
    const anchor = Math.abs(cosv) < 0.28 ? "middle" : (cosv > 0 ? "start" : "end");
    const dy = sinv > 0.55 ? 12 : (sinv < -0.55 ? -6 : 4);
    g += '<text x="' + q[0].toFixed(1) + '" y="' + (q[1] + dy).toFixed(1) + '" text-anchor="' + anchor +
         '" font-size="12" fill="' + (opts.hi === i ? "#0b3d91" : "#42536b") + '" font-weight="' + (opts.hi === i ? "700" : "600") + '">' + dm.n + '</text>';
    if(opts.showVal){
      g += '<text x="' + q[0].toFixed(1) + '" y="' + (q[1] + dy + 14).toFixed(1) + '" text-anchor="' + anchor +
           '" font-size="10.5" fill="#93a1b6">' + Math.round(vals[i]) + '</text>';
    }
  });
  return '<svg class="radar" viewBox="0 0 340 320" role="img" aria-label="六维能力雷达"><title>六维能力雷达</title>' + g + '</svg>';
}

function ladderHTML(cur){
  /* 从 C6 顶到 C1 底：用 column-reverse，所以数组顺序为 C1→C6 */
  return '<div class="ladder">' + COG.map(function(L, i){
    const cls = i === cur ? " on" : (i < cur ? " past" : "");
    const mark = i === cur ? ' ▸' : "";

/* 能力原型：按最强项命名 */
const ARCH = ["会想型", "会说型", "会判型", "会做型", "守规型", "自驱型"];

/* =========================================================
   七、机构版：计分与报告
   ========================================================= */
function orgAnalyze(a){
  const dims = [0,0,0,0,0,0], tot = [0,0,0,0,0,0], rates = [0,0,0,0,0,0];
  const hits = {}, wrong = [];
  ORG.forEach(function(it, i){
    tot[it.d]++;
    const tags = tagsOf(it), c = a[i];
    if(tags[c] === null) dims[it.d] += 2;
    else {
      const tg = tags[c] || "W2";
      hits[tg] = (hits[tg] || 0) + 1;
      wrong.push({ n:it.n || (i+1), p:it.p, d:it.d, tag:tg });
    }
  });
  dims.forEach(function(v, i){ rates[i] = tot[i] ? v / (tot[i] * 2) : 0; });

  const total = dims.reduce((x,y) => x + y, 0);
  const level = ORG_LEVELS.find(L => total >= L.lo && total <= L.hi) || ORG_LEVELS[4];

  let best = 0;
  for(let i = 1; i < 6; i++){ if(rates[i] > rates[best]) best = i; }
  const worst = pickWorst(rates);
  const spread = Math.max.apply(null, rates) - Math.min.apply(null, rates);
  const even = spread <= 0.09;
  const strong = mean(rates) >= 0.75;
  const conceptTags = ["W1","W2","W7"];
  const conceptWrong = Object.keys(hits).filter(k => conceptTags.indexOf(k) >= 0)
                        .reduce((s, k) => s + hits[k], 0);
  const cogIdx = cogIndex(rates[0], conceptWrong, 6);
  const cogLv = cogLevel(cogIdx);

  /* 成长潜力四因子 */
  const T = transferScore(ORG, a, 0).v;
  const deepItems = ORG.map(function(it, i){ return { it: it, i: i }; }).filter(x => x.it.lv === 3);
  const D = deepItems.length ? deepItems.filter(x => a[x.i] === rightOf(x.it)).length / deepItems.length : .5;
  const R = 1 - clamp((hits.W8 || 0) / 2, 0, 1);
  const Sg = stabilityOf(rates);
  const p = gpiCalc({ T: T, D: D, R: R, S: Sg });

  const rank = Object.keys(hits).map(k => [k, hits[k]]).sort((x,y) => y[1] - x[1] || (x[0] < y[0] ? -1 : 1));
  return { dims, tot, rates, total, level, best, worst, rank, hits, wrong, even, strong,
           cogIdx: cogIdx, cogLv: cogLv, gpi: p, factors: { T: T, D: D, R: R, S: Sg } };
}

function orgConclude(r){
  let line = r.level.line;
  if(r.rates[r.worst] <= 0.25){
    line = "他的总分到了「" + r.level.n + "」这一档，但“" + DIMS[r.worst].n + "”只有 " + r.dims[r.worst] + "／8——这会是接下来最该补的地方，也是这一档里见效最快的地方。";
    if(r.level.c === "S4" || r.level.c === "S5"){
      line = "整体已经不错，但“" + DIMS[r.worst].n + "”只有 " + r.dims[r.worst] + "／8，短板就在这一块。";
    }
  }
  return line;
}

function dimTag(v, max){
  const p = v / max;
  return p >= 0.85 ? "L4 突出" : p >= 0.62 ? "L3 稳定" : p >= 0.38 ? "L2 萌芽" : "L1 起点";
}
function stars4(v){
  const n = Math.round(v / 2);
  let s = "";
  for(let i = 0; i < 4; i++) s += i < n ? "★" : "<i>★</i>";
  return s;
}
function stars5(n){
  let s = "";
  for(let i = 0; i < 5; i++) s += i < n ? "★" : "<i>★</i>";
  return s;
}

function schoolAnalyze(a){
  const LIT = S.lit;
  const dims = [0,0,0,0,0,0], tot = [0,0,0,0,0,0], rates = [0,0,0,0,0,0], wrongs = [];
  LIT.forEach(function(it, i){
    tot[it.d]++;
    if(a[i] === rightOf(it)) dims[it.d]++;
    else wrongs.push({ n:i+1, p:it.p, d:it.d, tag:tagsOf(it)[a[i]] || "W2" });
  });
  dims.forEach(function(v, i){ rates[i] = tot[i] ? v / tot[i] : 0; });

  let pot = 0;
  const potDet = [];
  POT.forEach(function(it, j){
    const c = a[LIT.length + j];
    const sc = it.score ? it.score[c] : (c === rightOf(it) ? 1 : 0);
    pot += sc;
    potDet.push({ tag:it.tag, label:it.label, dim:it.dim, sc:sc, max: it.score ? 3 : 1, hit: it.score ? sc >= 2 : c === rightOf(it) });
  });
  const potRate = pot / 10;
  const idx = Math.round(potRate * 100);
  const tier = idx >= 75 ? TIERS[0] : idx >= 60 ? TIERS[1] : TIERS[2];

  let best = 0;
  for(let i = 1; i < 6; i++){ if(rates[i] > rates[best]) best = i; }
  const worst = pickWorst(rates);
  const spread = Math.max.apply(null, rates) - Math.min.apply(null, rates);
  const even = spread <= 0.09;
  const strong = mean(rates) >= 0.75;

  const conceptWrong = wrongs.filter(w => ["W1","W2","W7"].indexOf(w.tag) >= 0).length;
  const cogIdx = cogIndex(rates[0], conceptWrong, Math.max(2, Math.round(LIT.length * 0.25)));
  const cogLv = cogLevel(cogIdx);

  const T = transferScore(LIT, a, 0).v;
  const deepItems = LIT.map(function(it, i){ return { it: it, i: i }; }).filter(x => x.it.lv === 3);
  const D = deepItems.length ? deepItems.filter(x => a[x.i] === rightOf(x.it)).length / deepItems.length : .5;
  const R = 1 - clamp(wrongs.filter(w => w.tag === "W8").length / 2, 0, 1);
  const Sg = stabilityOf(rates);
  const gp = gpiCalc({ T: T, D: D, R: R, S: Sg, potRate: potRate });

  return {
    dims, tot, rates, litTotal: dims.reduce((x,y)=>x+y,0), full: LIT.length,
    pot, potRate, idx, tier, best, worst, wrongs, potDet, even, strong,
    cogIdx: cogIdx, cogLv: cogLv, gpi: gp,
    factors: { T: T, D: D, R: R, S: Sg }
  };
}

    '全部阈值为设计经验值，非常模；成长潜力值含推断成分，仅用于教学分层，不用于任何形式的选拔排序。</div>' +
  '</div>';

let pdfBlobURL=null,pdfBlob=null,pdfFileName='',reportImageURL='',pdfGeneration=0;
async function saveReportImage(){
  if(!reportImageURL)return;
  const imageBlob=await (await fetch(reportImageURL)).blob();
  const fileName=pdfFileName.replace(/\.pdf$/i,'.jpg');
  const file=typeof File==='function' ? new File([imageBlob],fileName,{type:'image/jpeg'}) : null;
  if(file && navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:'AI 素养测评报告图片'});return}
    catch(err){if(err.name==='AbortError')return;console.warn('图片分享不可用',err)}
  }
  const overlay=document.createElement('div');overlay.className='report-image-view';
  const toolbar=document.createElement('div');toolbar.className='image-toolbar';
  toolbar.innerHTML='<span>长按下方报告图片，可保存到手机相册</span><button type="button">关闭</button>';
  toolbar.querySelector('button').onclick=()=>overlay.remove();
  const img=document.createElement('img');img.src=reportImageURL;img.alt='AI 素养测评报告长图';
  overlay.append(toolbar,img);document.body.appendChild(overlay);
}
async function saveReportPDF(){
  if(!pdfBlob)return;
  const file=typeof File==='function' ? new File([pdfBlob],pdfFileName,{type:'application/pdf'}) : null;
  // 手机系统分享面板可把 PDF 存入“文件”、发送给老师或保存到其他应用。
  if(file && navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:'AI 素养测评报告'});return}
    catch(err){if(err.name==='AbortError')return;console.warn('文件分享不可用',err)}
  }
  // Android 浏览器和桌面浏览器使用下载属性，避免仅打开 blob 预览。
  const a=document.createElement('a');
  a.href=pdfBlobURL;a.download=pdfFileName;a.style.display='none';
  document.body.appendChild(a);a.click();a.remove();
  const hint=document.querySelector('#s-result .pdf-hint');
  if(hint)hint.textContent='如当前应用没有保存文件，请点“预览 PDF”，在预览页使用右上角的分享或保存。';
}
async function prepareReportPDF(){
  const link=document.querySelector('#s-result .pdf-download');
  if(!link)return;
  const imageButton=document.querySelector('#s-result .image-download');
  const generation=++pdfGeneration;
  document.querySelector('#s-result .pdf-hint')?.remove();
  if(pdfBlobURL){URL.revokeObjectURL(pdfBlobURL);pdfBlobURL=null;pdfBlob=null}
  reportImageURL='';if(imageButton){imageButton.disabled=true;imageButton.textContent='正在准备报告图片…'}
  link.disabled=true;link.textContent='正在准备 PDF…';
  if(!window.html2canvas||!window.jspdf){link.textContent='PDF 组件未加载，请刷新页面';return}
  const tv=document.getElementById('tv');
  const report=(tv && tv.style.display!=='none') ? tv : (document.getElementById('sv')||document.getElementById('result'));
  try{
    const canvas=await html2canvas(report,{backgroundColor:'#ffffff',scale:2,useCORS:true,logging:false,onclone(doc){
      doc.querySelectorAll('.noprint,.acct,.tabs').forEach(el=>el.remove());
      const target=doc.getElementById(report.id);
      if(target){target.style.display='block';target.style.animation='none'}
    }});
    if(generation!==pdfGeneration)return;
    if(!canvas.width||!canvas.height)throw Error('报告内容为空');
    reportImageURL=canvas.toDataURL('image/jpeg',0.9);
    if(imageButton){imageButton.disabled=false;imageButton.textContent='保存报告图片'}
    const pdf=new jspdf.jsPDF({orientation:'portrait',unit:'mm',format:'a4',compress:true});
    const contentW=190,contentH=277,margin=10;
    const sliceH=Math.floor(canvas.width*contentH/contentW);
    let page=0;
    for(let y=0;y<canvas.height;y+=sliceH){
      const h=Math.min(sliceH,canvas.height-y);
      const part=document.createElement('canvas');part.width=canvas.width;part.height=h;
      part.getContext('2d').drawImage(canvas,0,y,canvas.width,h,0,0,canvas.width,h);
      if(page++)pdf.addPage();
      pdf.addImage(part.toDataURL('image/jpeg',0.9),'JPEG',margin,margin,contentW,h*contentW/canvas.width);
    }
    const blob=pdf.output('blob');
    pdfBlob=blob;pdfBlobURL=URL.createObjectURL(blob);
    const safe=(S.name||'学员').replace(/[\\/:*?"<>|]/g,'').slice(0,16);
    pdfFileName='AI素养测评报告-'+safe+'-'+today()+'.pdf';
    link.disabled=false;link.textContent='保存／分享 PDF 报告';
    const hint=document.createElement('div');hint.className='pdf-hint noprint';
    hint.style.cssText='color:#667893;font-size:12px;margin:8px 0 0;';
    hint.innerHTML='手机上可在系统分享面板中选“存储到文件”；在微信内也可用“保存报告图片”长按保存。 <a href="'+pdfBlobURL+'" target="_blank" rel="noopener" style="color:#3169dd">预览 PDF</a>';
    link.parentElement.insertAdjacentElement('afterend',hint);
  }catch(err){console.error(err);if(generation===pdfGeneration)link.textContent='生成失败，请重新施测或刷新页面'}
}

function schoolTab(i, btn){
  document.querySelectorAll(".tabs button").forEach(b => b.classList.remove("on"));
  btn.classList.add("on");
  $("sv").style.display = i === 0 ? "" : "none";
  $("tv").style.display = i === 1 ? "" : "none";
  setTimeout(prepareReportPDF,100);
}

function submitBook(kind){
  const p = (($("f2") && $("f2").value) || "").replace(/\D/g,"");
  if(p.length < 6){ alert("请填一个有效的手机号，方便确认时间。"); return; }
  $("modalBox").innerHTML =
    '<h3>已记下</h3>' +
    '<p>我们会在 1 个工作日内联系您确认时间。' + (kind ? "" : "学校版会一并发送施测手册与汇总表模板。") + '</p>' +
    '<button class="btn btn-ghost btn-block" onclick="closeModal()">关闭</button>' +
    '<p style="font-size:11.5px;color:var(--mute);margin:12px 0 0">体验版：仅本机模拟，未发送任何数据。</p>';
}
